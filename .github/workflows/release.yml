# Builds the Mac app when a version tag like v0.7.0 is pushed, signs the update files and
# publishes everything as a release of THIS repository.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FilmRoll Manager ${{ github.ref_name }}"
          releaseBody: |
            **Mac with Apple Silicon (M1 or newer):** download the `.dmg`, drag the app into Applications.
            The first time, right-click the app and choose "Open" (the app is not signed with an Apple developer account).
            If macOS still refuses: `xattr -dr com.apple.quarantine "/Applications/FilmRoll Manager.app"` in Terminal.

            Already installed? Open Settings in the app and choose "Check now" to update.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin

      # TRANSITION (remove once nobody uses 0.6.0 or older any more):
      # apps up to 0.6.0 still look for updates in the old releases repository. Give that repository the
      # small update file (it points to the downloads in this repository), so those apps find this version.
      - name: Hand the update info to the old releases repository
        env:
          NEW_REPO_TOKEN: ${{ github.token }}
          OLD_REPO_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          GH_TOKEN="$NEW_REPO_TOKEN" gh release download "$TAG" -R "${{ github.repository }}" -p latest.json
          GH_TOKEN="$OLD_REPO_TOKEN" gh release create "$TAG" latest.json -R michelehimself/filmroll-manager-releases \
            --title "FilmRoll Manager $TAG" \
            --notes "The app moved. Downloads: https://github.com/${{ github.repository }}/releases/tag/$TAG"
