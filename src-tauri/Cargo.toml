[package]
name = "filmroll-manager"
version = "0.1.0"
description = "Prepare film scans for your photo library"
authors = ["@MicheleHimself"]
edition = "2021"

[lib]
name = "filmroll_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
little_exif = "0.6"
img-parts = "0.3"
natord = "1.0"
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
pdf-writer = "0.15.0"

# Decoding large scans is slow in debug builds, so optimise the libraries even there
[profile.dev.package."*"]
opt-level = 3
